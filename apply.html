<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenRice 餐廳開通</title>
<meta name="description" content="讓港澳與台灣客人在 OpenRice 直接訂你的位子。客人到店才收費，沒有上架費、月費，隨時可以停。">
<style>
/* 版面：單欄、手機優先。說明頁讓老闆 1 分鐘看懂，申請頁一頁一件事。 */
:root{
  --bg:#FFFFFF; --soft:#FAF8F6; --fg:#3E2723; --muted:#8D6E63; --line:#E0DAD6;
  --accent:#F15A22; --accent-dark:#C9461A; --ok:#2E7D32; --warn:#B4541A;
  --font:'PingFang TC','Heiti TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.narrow{max-width:560px}
.num{font-variant-numeric:tabular-nums}

/* 頂部 */
.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:700;font-size:18px;letter-spacing:.01em;text-decoration:none;color:var(--fg)}
.brand span{color:var(--accent)}
.top-cta{font-size:14px;font-weight:700;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:999px;padding:6px 14px}
.demo{background:var(--soft);font-size:13px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line)}

/* 說明頁 */
.hero{display:grid;grid-template-columns:1fr 260px;gap:40px;align-items:center;padding-block:40px 32px}
.hero h1{font-size:34px;line-height:1.3;margin:0 0 14px;text-wrap:balance}
.hero p.lead{font-size:18px;margin:0 0 24px}
.hero p.lead b{color:var(--accent)}
.hero video{width:100%;aspect-ratio:9/16;border-radius:var(--r);background:#2A1C19;display:block}
.vcap{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}
.btn{display:inline-block;border:0;border-radius:var(--r);padding:14px 22px;font-weight:700;font-size:17px;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);color:#FFFFFF}
.btn.primary:hover{background:var(--accent-dark)}
.btn.ghost{background:var(--bg);border:1px solid var(--line);color:var(--fg)}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.under{font-size:14px;color:var(--muted);margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-block:8px 36px;border-bottom:1px solid var(--line)}
.fact b{display:block;font-size:26px;line-height:1.2}
.fact span{font-size:14px;color:var(--muted)}
section.block{padding-block:40px;border-bottom:1px solid var(--line)}
section.block h2{font-size:24px;margin:0 0 6px;text-wrap:balance}
section.block .sub{color:var(--muted);margin:0 0 20px}

.calc{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.label{font-weight:700;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=search],select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
input:focus,select:focus{border-color:var(--accent);outline:none}
.result{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.result .big{font-size:40px;font-weight:700;color:var(--accent);line-height:1.1}
.result .kv{display:flex;justify-content:space-between;gap:12px;padding-block:6px;border-top:1px solid var(--line);font-size:15px}
.result .kv:first-of-type{border-top:0}

table.price{width:100%;border-collapse:collapse;font-size:15px}
table.price th,table.price td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.price th{width:44%;font-weight:700}
table.price td b{color:var(--accent)}
.note{font-size:14px;color:var(--muted)}

.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.steps3 div{border:1px solid var(--line);border-radius:var(--r);padding:16px}
.steps3 b{display:block;font-size:17px;margin-bottom:4px}
.steps3 span{font-size:14px;color:var(--muted)}
.steps3 i{font-style:normal;font-size:13px;font-weight:700;color:var(--accent)}

details.faq{border-bottom:1px solid var(--line)}
details.faq summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";color:var(--muted);font-weight:400}
details.faq[open] summary::after{content:"−"}
details.faq p{margin:0 0 14px;color:var(--fg)}
.final{padding-block:48px;text-align:center}
.final h2{font-size:24px;margin:0 0 16px}
footer{padding-block:28px 60px;font-size:13px;color:var(--muted)}

/* 申請頁 */
.apply{padding-block:20px 80px}
.progress{display:flex;gap:6px;margin:6px 0 4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)}
.stepno{font-size:13px;color:var(--muted);margin-bottom:18px}
.apply h2{font-size:24px;margin:0 0 6px;line-height:1.35;text-wrap:balance}
.apply .sub{color:var(--muted);margin:0 0 20px}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px}
.res{display:flex;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:var(--bg);text-align:left;width:100%}
.res:first-child{border-top:0}
.res:hover,.res:focus-visible{background:var(--soft)}
.res img,.res .ph{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:0 0 52px;background:var(--soft)}
.res .t{font-weight:700;line-height:1.35}
.res .m{font-size:13px;color:var(--muted);line-height:1.4}
.res .tag{font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap;margin-left:auto}
.picked{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--soft)}
.picked img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.picked .t{font-weight:700;font-size:17px;line-height:1.35}
.alert{border-radius:var(--r);padding:14px 16px;margin:14px 0;font-size:15px;border:1px solid var(--line);background:var(--soft)}
.alert.ok{border-color:#C8E6C9;background:#F3FAF3}
.alert.warn{border-color:#F3D3C2;background:#FDF5F0}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;background:var(--bg)}
.choice input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:0 0 18px}
.choice b{display:block}
.choice span{font-size:14px;color:var(--muted)}
.choice:has(input:checked){border-color:var(--accent);background:#FFF8F4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--bg);font-size:15px}
.day[aria-pressed="true"]{background:var(--fg);color:#FFFFFF;border-color:var(--fg)}
.meal{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.meal .head{display:flex;align-items:center;gap:10px;font-weight:700}
.meal .head input{accent-color:var(--accent);width:18px;height:18px}
.meal .times{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px}
.switch{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.switch .txt b{display:block;font-size:17px}
.switch .txt span{font-size:14px;color:var(--muted)}
.tog{position:relative;width:52px;height:30px;flex:0 0 52px;border-radius:999px;border:0;background:var(--line);padding:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;transition:left .15s}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"]::after{left:25px}
.tog[disabled]{opacity:.5;cursor:not-allowed}
.terms{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--soft);font-size:15px}
.terms ul{margin:6px 0 0;padding-left:20px}
.terms li{margin:4px 0}
.agree{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-size:15px}
.agree input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:0 0 20px}
.nav{display:flex;gap:10px;margin-top:24px}
.nav .btn{flex:1}
.nav .btn.ghost{flex:0 0 auto}
.err{color:var(--warn);font-size:14px;margin-top:4px}
.saved{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.done-mark{font-size:28px;font-weight:700;margin:12px 0 8px}
.timeline{border-left:2px solid var(--line);margin:18px 0 18px 8px;padding-left:18px}
.timeline div{position:relative;margin-bottom:16px}
.timeline div::before{content:"";position:absolute;left:-25px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.timeline div.now::before{background:var(--accent)}
.timeline b{display:block}
.timeline span{font-size:14px;color:var(--muted)}
.idbox{font-size:20px;font-weight:700;letter-spacing:.04em}

/* 內部：申請紀錄 */
.admin table{width:100%;border-collapse:collapse;font-size:14px}
.admin th,.admin td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.admin th{background:var(--soft)}
.tbl{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ops{color:var(--ok)}
.pill.bd{color:var(--accent)}
.pill.low{color:var(--muted)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 20px}
.stats4 div{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stats4 b{display:block;font-size:22px}
.stats4 span{font-size:13px;color:var(--muted)}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:24px;padding-block:28px 24px}
  .hero h1{font-size:27px}
  .hero .vid{max-width:240px;margin:0 auto}
  .facts{grid-template-columns:1fr;gap:10px}
  .fact b{font-size:22px;display:inline;margin-right:8px}
  .calc{grid-template-columns:1fr;gap:8px}
  .steps3{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .stats4{grid-template-columns:repeat(2,1fr)}
  table.price th{width:46%}
}
@media (prefers-reduced-motion:reduce){.tog::after{transition:none}}

.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0;padding:16px;border:1px solid var(--line);border-radius:12px}
.review-grid label{display:block}.review-grid input:not([type=checkbox]),.review-grid textarea{width:100%}
.review-checks,.review-note{grid-column:1/-1}.review-checks label{margin:8px 0}.review-memo{white-space:pre-wrap}.terms textarea{display:block;width:100%;margin:8px 0 12px;resize:vertical}
@media(max-width:600px){.review-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#home" data-go="home">Open<span>Rice</span> 餐廳開通</a>
  <button class="top-cta" type="button" data-go="apply">開始申請</button>
</div></header>

<main id="view"></main>

<script>
(function(){
'use strict';
var DATA_URL='data/restaurants.json';
var PHOTO='https://cdn-tw.orstatic.com/userphoto/photo/';
var LINE_ID='@rby1007s';
var KEY_DRAFT='or-public-open-draft-v1', KEY_APPS='or-open-apps-v1', KEY_EV='or-open-ev-v1';
var view=document.getElementById('view');
var REST=null, loading=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function get(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function ev(name){var e=get(KEY_EV,{});e[name]=(e[name]||0)+1;put(KEY_EV,e);}
function fmt(n){return Math.round(n).toLocaleString('zh-TW');}

/* ---------- 說明頁 ---------- */
function home(){
  return ''+
  '<div class="wrap">'+
  '<div class="hero"><div>'+
    '<h1>讓港澳和台灣的客人，直接在 OpenRice 訂你的位子</h1>'+
    '<p class="lead">客人<b>真的到店</b>才收費，每位 NT$25。<br>沒來不收，沒有上架費、月費，隨時可以停。</p>'+
    '<button class="btn primary" type="button" data-go="apply">開始申請（約 10 分鐘）</button>'+
    '<div class="under">手機就能申請。送出後由 OpenRice 確認資料與開通設定。</div>'+
  '</div></div>'+
  '<div class="facts">'+
    '<div class="fact"><b>800 萬</b><span>OpenRice 會員</span></div>'+
    '<div class="fact"><b>100 萬人次以上</b><span>港澳旅客每年來台</span></div>'+
    '<div class="fact"><b>不用改系統</b><span>用 inline 或 Oddle，訂位自動進你原本的系統</span></div>'+
  '</div>'+

  '<section class="block"><h2>先算一下划不划算</h2><p class="sub">輸入你的客單價，看帶一位客人要花多少。</p>'+
  '<div class="calc"><div>'+
    '<div class="field"><label for="c-avg">每位客人平均消費</label><input id="c-avg" type="number" inputmode="numeric" min="100" step="50" value="800"><span class="hint">單位：元</span></div>'+
    '<div class="field"><label for="c-n">每月 OpenRice 帶來幾位客人</label><input id="c-n" type="number" inputmode="numeric" min="1" step="5" value="40"><span class="hint">先用估計值，上線後看實際數字最準</span></div>'+
  '</div><div class="result" id="c-out"></div></div></section>'+

  '<section class="block"><h2>怎麼收費</h2><p class="sub">按訂位來源及實際到店人數計費。</p>'+
  '<table class="price">'+
    '<tr><th>OpenRice 帶來的客人</th><td>每位<b>到店</b> NT$25</td></tr>'+
    '<tr><th>訂了沒來、取消</th><td>不收</td></tr>'+
    '<tr><th>上架費、月費、年費、系統費</th><td>沒有</td></tr>'+
    '<tr><th>綁約、違約金</th><td>沒有，用 LINE 說一聲就能停</td></tr>'+
    '<tr><th>Google 地圖的預約按鈕</th><td>預設開啟，從這裡訂位的客人每位到店 NT$5。不想要可以關掉</td></tr>'+
  '</table>'+
  '<p class="note">結算方式：每季寄一次付款通知，依實際到店人數計算；單季不到 NT$500 累計到下一季。</p></section>'+

  '<section class="block"><h2>開通只要三步</h2><p class="sub">不用見面，不用寄紙本。</p>'+
  '<div class="steps3">'+
    '<div><i>第 1 步</i><b>找到你的店</b><span>填寫店名和分店地址，我們會核對對應的 OpenRice 店頁。</span></div>'+
    '<div><i>第 2 步</i><b>設定怎麼接訂位</b><span>用 inline／Oddle 的自動同步；沒有系統就選開放時段，訂位用 LINE 或 Email 通知你。</span></div>'+
    '<div><i>第 3 步</i><b>線上同意，等上線</b><span>送出申請後，OpenRice 會與你確認合作條件及開通設定。</span></div>'+
  '</div></section>'+

  '<section class="block"><h2>常見問題</h2>'+
  faq('原本的熟客也要付費嗎？','不用。只有透過 OpenRice 網站、App，或 Google 地圖預約按鈕訂位的客人才算。打電話、直接走進來、用你自己訂位系統訂的客人都不算。')+
  faq('會不會增加門市的工作？','用 inline 或 Oddle 的店，訂位會自動進原本的系統，門市作業不變。沒有系統的店，訂位會用 LINE 或 Email 通知，只要在訂位時間準備好位子。')+
  faq('可以只開平日或離峰嗎？','可以。開放哪幾天、哪些時段、每段幾組，都由你決定，隨時可以改。用空位補離峰正是最划算的用法。')+
  faq('Google 地圖的預約按鈕是什麼？','開通後，你在 Google 地圖的店家資訊可能出現「預約」按鈕，客人從那裡訂位也會進來。這部分每位到店 NT$5，預設開啟。不想要的話，申請時或之後都可以關掉。')+
  faq('客人沒來怎麼辦？','沒來不收費。請在用餐日後 48 小時內把訂位狀態改成「未到」，超過 48 小時沒更新會視為已到店。')+
  faq('不想合作了怎麼辦？','用 LINE 或書面通知我們就好，3 個工作天內停止接新訂位，沒有違約金。已經到店的客人照實際人數結算。')+
  faq('要提供銀行帳戶嗎？','申請時不用。等你接到第一筆訂位，我們再請你補發票與帳務資料。')+
  faq('有吃飯賺哩程嗎？','有。客人在店裡消費可以累積 Asia Miles，這是另外的選項，開通後再跟我們說就好，跟 Google 預約按鈕開不開沒有關係。')+
  '</section>'+

  '<div class="final"><h2>準備好了就開始</h2><button class="btn primary" type="button" data-go="apply">開始申請（約 10 分鐘）</button>'+
  '<div class="under">想先問問題？加餐廳小幫手 LINE：<b>'+LINE_ID+'</b></div></div>'+
  '<footer>台灣開飯喇股份有限公司 · OpenRice Taiwan · <a href="https://line.me/R/ti/p/@rby1007s">餐廳小幫手</a></footer>'+
  '</div>';
}
function faq(q,a){return '<details class="faq"><summary>'+esc(q)+'</summary><p>'+esc(a)+'</p></details>';}
function calc(){
  var a=+document.getElementById('c-avg').value||0, n=+document.getElementById('c-n').value||0, out=document.getElementById('c-out');
  if(!out)return;
  var fee=n*25, rev=n*a, pct=rev?fee/rev*100:0;
  out.innerHTML='<div class="note">帶一位客人的成本</div><div class="big num">'+(a?(25/a*100).toFixed(1):'0')+'%</div>'+
    '<div class="note" style="margin-bottom:10px">客單價 '+fmt(a)+' 元，每位 NT$25</div>'+
    '<div class="kv"><span>每月帶來營收</span><b class="num">NT$'+fmt(rev)+'</b></div>'+
    '<div class="kv"><span>每月付給 OpenRice</span><b class="num">NT$'+fmt(fee)+'</b></div>'+
    '<div class="kv"><span>沒來的客人</span><b>NT$0</b></div>';
}

/* ---------- 申請流程 ---------- */
var STEPS=['店','系統','時段','Google','聯絡人','同意'];
var D=get(KEY_DRAFT,null)||fresh();
function fresh(){return {step:0,store:null,manual:{name:'',addr:''},system:'',otherSystem:'',notify:{line:'',email:''},days:[1,2,3,4,5,6,0],lunch:{on:true,s:'11:30',e:'14:00'},dinner:{on:true,s:'17:30',e:'20:30'},groups:2,maxParty:8,google:true,photos:[],contact:{name:'',role:'負責人',phone:'',email:'',line:''},agree:false};}
function save(){put(KEY_DRAFT,D);}
function integrated(){return D.system==='inline'||D.system==='oddle';}
function noPhoto(){return D.store&&!D.store.photo&&!(D.store.photos>0);}
function priceMax(label){if(!label)return 0;var m=String(label).match(/(\d+)\s*$/);if(/以下/.test(label)){var k=String(label).match(/(\d+)/);return k?+k[1]:0;}return m?+m[1]:0;}
function route(){
  if(D.manual)return {k:'ops',t:'人工確認店頁',d:'找不到店頁，營運先確認或建立店頁'};
  if(D.store&&D.store.chain>=3)return {k:'bd',t:'連鎖：轉業務',d:'同名店有 '+D.store.chain+' 家，轉 Jason 談連鎖方案'};
  var pm=priceMax(D.store&&D.store.price);
  var low=pm>0&&pm<=300;
  if(integrated())return {k:low?'low':'ops',t:(low?'低優先・':'')+'串接店：營運審核',d:'目標 1 個工作天上線'};
  return {k:low?'low':'ops',t:(low?'低優先・':'')+'單店：營運審核',d:'目標 2 個工作天上線'};
}

function progress(){var h='<div class="progress" aria-hidden="true">';for(var i=0;i<STEPS.length;i++)h+='<i class="'+(i<=D.step?'on':'')+'"></i>';return h+'</div><div class="stepno">第 '+(D.step+1)+' 步，共 '+STEPS.length+' 步</div>';}
function nav(nextLabel,ok){
  return '<div class="nav">'+(D.step>0?'<button class="btn ghost" type="button" data-act="back">上一步</button>':'')+
    '<button class="btn primary" type="button" data-act="next"'+(ok?'':' disabled')+'>'+(nextLabel||'下一步')+'</button></div>'+
    '<div class="saved">填到一半可以離開，下次打開會從這裡繼續。</div>';
}
function stepStore(){
  const store=D.manual;
  return '<h2>要為哪家餐廳申請？</h2><p class="sub">請填寫完整店名與地址，OpenRice 會確認正確店頁。</p>'+
    '<div class="field"><label for="m-name">餐廳名稱及分店</label><input id="m-name" maxlength="120" value="'+esc(store.name)+'" autocomplete="organization"></div>'+
    '<div class="field"><label for="m-addr">完整分店地址</label><input id="m-addr" maxlength="200" value="'+esc(store.addr)+'" autocomplete="street-address"></div>'+
    nav('下一步',store.name.trim()&&store.addr.trim());
}
function stepSystem(){
  var opt=function(v,t,s){return '<label class="choice"><input type="radio" name="sys" value="'+v+'"'+(D.system===v?' checked':'')+'><div><b>'+t+'</b><span>'+s+'</span></div></label>';};
  var h='<h2>你現在怎麼接訂位？</h2><p class="sub">我們會把 OpenRice 的訂位送到你習慣的地方。</p><div class="choices">'+
    opt('inline','用 inline','訂位自動進 inline，門市作業不變，也不用另外設定時段')+
    opt('oddle','用 Oddle','訂位自動進 Oddle，門市作業不變，也不用另外設定時段')+
    opt('other','用其他訂位系統','我們會確認能不能串接；不能串接就改用 LINE 或 Email 通知')+
    opt('none','沒有訂位系統','電話、留言或表單接訂位的店，訂位會用 LINE 或 Email 通知你')+
  '</div>';
  if(D.system==='other')h+='<div class="field" style="margin-top:14px"><label for="o-sys">系統名稱</label><input id="o-sys" type="text" value="'+esc(D.otherSystem)+'"></div>';
  if(D.system==='other'||D.system==='none'){
    h+='<div class="label" style="margin-top:16px">訂位通知要送到哪裡？至少填一個</div>'+
       '<div class="field" style="margin-top:8px"><label for="n-line">LINE ID</label><input id="n-line" type="text" value="'+esc(D.notify.line)+'" autocomplete="off"></div>'+
       '<div class="field"><label for="n-email">Email</label><input id="n-email" type="email" value="'+esc(D.notify.email)+'" autocomplete="email"></div>';
  }
  var ok=D.system&&(integrated()||(D.notify.line.trim()||validEmail(D.notify.email)))&&(D.system!=='other'||D.otherSystem.trim());
  return h+nav('下一步',!!ok);
}
function stepSlots(){
  if(integrated()){
    return '<h2>開放時段會從 '+(D.system==='inline'?'inline':'Oddle')+' 同步</h2><p class="sub">你在系統裡開放的時段和人數上限，OpenRice 會直接沿用。之後想調整，在原本的系統改就好。</p>'+
      '<div class="alert ok">這一步不用填。</div>'+nav('下一步',true);
  }
  var names=['日','一','二','三','四','五','六'], order=[1,2,3,4,5,6,0];
  var h='<h2>開放哪些時段給 OpenRice 的客人？</h2><p class="sub">先用常見設定，上線後隨時可以改。只想補平日或離峰的空位也可以。</p>'+
    '<div class="label">哪幾天</div><div class="days" role="group" aria-label="開放的星期" style="margin:8px 0 18px">'+
    order.map(function(d){return '<button type="button" class="day" data-day="'+d+'" aria-pressed="'+(D.days.indexOf(d)>=0)+'">週'+names[d]+'</button>';}).join('')+'</div>'+
    meal('lunch','午餐')+meal('dinner','晚餐')+
    '<div class="row2" style="margin-top:8px">'+
      '<div class="field"><label for="g-n">每 30 分鐘最多接幾組</label><select id="g-n">'+[1,2,3,4,5,6].map(function(n){return '<option'+(D.groups===n?' selected':'')+'>'+n+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label for="g-p">一組最多幾位</label><select id="g-p">'+[2,4,6,8,10,12,15,20].map(function(n){return '<option'+(D.maxParty===n?' selected':'')+'>'+n+'</option>';}).join('')+'</select></div>'+
    '</div>';
  var ok=D.days.length&&(D.lunch.on||D.dinner.on);
  if(!ok)h+='<div class="err">至少選一天，並開放午餐或晚餐其中一個。</div>';
  return h+nav('下一步',!!ok);
}
function meal(k,t){
  var m=D[k], opts=function(sel){var o='';for(var h=10;h<=22;h++)['00','30'].forEach(function(mm){var v=(h<10?'0':'')+h+':'+mm;o+='<option'+(v===sel?' selected':'')+'>'+v+'</option>';});return o;};
  return '<div class="meal"><label class="head"><input type="checkbox" data-meal="'+k+'"'+(m.on?' checked':'')+'>'+t+'</label>'+
    (m.on?'<div class="times"><select data-mt="'+k+'-s" aria-label="'+t+'開始">'+opts(m.s)+'</select><span class="note">到</span><select data-mt="'+k+'-e" aria-label="'+t+'最後入座">'+opts(m.e)+'</select></div><div class="note" style="margin-top:6px">後面的時間是最後一組入座時間</div>':'')+'</div>';
}
function stepGoogle(){
  var h='<h2>讓在 Google 地圖找到你的客人直接訂位</h2>'+
    '<p class="sub">開啟後，你的店家資訊可能顯示「預約」按鈕。客人查地址、看評論時，就多一個可以直接訂位的入口。</p>'+
    '<div class="switch"><div class="txt"><b>Google 地圖預約</b><span>從這個入口訂位的客人，每位到店 NT$5。沒到店不收費。</span></div>'+
    '<button type="button" class="tog" role="switch" aria-label="Google 地圖預約" aria-checked="'+(D.google?'true':'false')+'" data-act="google"></button></div>';
  if(!D.google)h+='<div class="alert warn" role="status"><b>關閉後，客人會少一個可以直接訂位的入口。</b><br>店家資訊仍可在 Google 地圖搜尋。你可以維持關閉，直接點「下一步」。</div>';
  if(integrated())h+='<div class="alert">已記錄你的選擇：<b>'+(D.google?'希望開啟':'希望關閉')+'</b>。你使用 '+(D.system==='inline'?'inline':'Oddle')+'，我們會在開通前與你確認，避免影響 OpenRice 訂位。</div>';
  return h+nav('下一步',true);
}
function stepContact(){
  var c=D.contact;
  var h='<h2>誰是聯絡人？</h2><p class="sub">開通進度和上線通知會傳給這個人。</p>'+
    '<div class="field"><label for="ct-name">姓名</label><input id="ct-name" type="text" value="'+esc(c.name)+'" autocomplete="name"></div>'+
    '<div class="field"><label for="ct-role">你的身分</label><select id="ct-role">'+['負責人','店長','行銷或管理人員'].map(function(r){return '<option'+(c.role===r?' selected':'')+'>'+r+'</option>';}).join('')+'</select><span class="hint">送出合約的人要能代表餐廳同意合作條件</span></div>'+
    '<div class="field"><label for="ct-phone">手機</label><input id="ct-phone" type="tel" inputmode="tel" value="'+esc(c.phone)+'" placeholder="0912345678" autocomplete="tel"><span class="hint">審核時如需確認資料，我們會用這支手機聯絡你</span></div>'+
    '<div class="field"><label for="ct-email">Email</label><input id="ct-email" type="email" value="'+esc(c.email)+'" autocomplete="email"><span class="hint">審核時如需確認資料，我們也可透過 Email 聯絡你</span></div>'+
    '<div class="field"><label for="ct-line">LINE ID（選填）</label><input id="ct-line" type="text" value="'+esc(c.line)+'" autocomplete="off"></div>'+
    '<div class="alert">收款帳戶和發票資料現在不用填。等你接到第一筆訂位，我們再請你補。</div>';
  var errs=[];
  if(c.phone&&!validPhone(c.phone))errs.push('手機格式看起來不對，請輸入 09 開頭的 10 碼數字。');
  if(c.email&&!validEmail(c.email))errs.push('Email 格式看起來不對。');
  if(errs.length)h+='<div class="err">'+errs.join('<br>')+'</div>';
  var ok=c.name.trim()&&validPhone(c.phone)&&validEmail(c.email);
  return h+nav('下一步',!!ok);
}
function stepAgree(){
  return '<h2>確認並送出開通申請</h2>'+
    '<p class="sub">OpenRice 會核對店家資料及接單設定，再與你確認合作條件。送件後請保留申請編號。</p>'+
    '<div class="terms"><b>'+esc(D.manual.name)+'</b><p>'+esc(D.manual.addr)+'</p><p>聯絡手機 '+esc(D.contact.phone)+'<br>聯絡 Email '+esc(D.contact.email)+'</p></div>'+
    '<div class="field"><label for="memo">備註（選填）</label><input id="memo" maxlength="200" value="'+esc(D.memo||'')+'" placeholder="例如：預計開通的分店數或希望聯絡的時間"></div>'+
    '<label class="agree"><input type="checkbox" id="agree" required'+(D.agree?' checked':'')+'><span>我有權代表餐廳提出開通申請，並同意 OpenRice 使用本表資料處理申請及聯絡我。送出後由 OpenRice 確認合作條件。</span></label>'+
    nav('送出開通申請',D.agree);
}
function validPhone(p){return /^09\d{8}$/.test(String(p).replace(/[\s-]/g,''));}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e).trim());}

function apply(){
  var body=[stepStore,stepSystem,stepSlots,stepGoogle,stepContact,stepAgree][D.step]();
  return '<div class="wrap narrow apply">'+progress()+body+'</div>';
}
function done(app){
  var r=app.route;
  var t1=r.k==='bd'?'專人聯絡你':'營運確認資料';
  var t1d=r.k==='bd'?'由專人確認合作方式與開通分店':'有問題會用 LINE 或電話找你';
  return '<div class="wrap narrow apply"><div class="done-mark">申請送出了</div>'+
    '<p>申請編號 <span class="idbox num">'+esc(app.id)+'</span></p><p class="sub">申請聯絡 Email 為 '+esc(app.contact.email)+'。請保留申請編號，方便後續查詢。</p>'+
    '<div class="timeline">'+
      '<div class="now"><b>已送出</b><span>'+esc(app.storeName)+'</span></div>'+
      '<div><b>'+t1+'</b><span>'+t1d+'。如需補資料，我們會一次列出需要確認的項目。</span></div>'+
      '<div><b>上線</b><span>確認店頁可訂、門市能收到通知後，我們會把可分享的訂位連結與接單方式提供給你</span></div>'+
      '<div><b>第一筆訂位</b><span>接到後，我們再請你補發票與帳務資料</span></div>'+
    '</div>'+
    '<div class="alert"><b>加餐廳小幫手 LINE，上線通知和問題都在這裡</b><br>LINE ID：<b>'+LINE_ID+'</b><br><a href="https://line.me/R/ti/p/'+LINE_ID+'" target="_blank" rel="noopener">用 LINE 加好友</a></div>'+
    '<div class="nav"><button class="btn ghost" type="button" data-go="home">回到首頁</button></div></div>';
}
var endpoint='https://agxpbjgatcxjlwdkrqev.supabase.co';
/* ---------- 路由與事件 ---------- */
var R='home', lastDone=null;
function routeFrom(){var h=(location.hash||'').slice(1);return ['apply','done'].indexOf(h)>=0?h:'home';}
function render(){
  if(R==='done'&&!lastDone)R='home';
  view.innerHTML=R==='apply'?apply():R==='done'?done(lastDone):home();
  if(R==='home'){['c-avg','c-n'].forEach(function(id){document.getElementById(id).addEventListener('input',calc);});calc();}
}
function go(r){R=r;try{if(location.hash.slice(1)!==r)history.replaceState(null,'','#'+r);}catch(e){}if(r==='apply'){ev('start');ev('step-'+D.step);}render();window.scrollTo(0,0);}
function rerender(focusId){var y=window.scrollY;render();window.scrollTo(0,y);if(focusId){var el=document.getElementById(focusId);if(el){el.focus();if(el.setSelectionRange&&el.type!=='email'&&el.type!=='number'){var l=el.value.length;try{el.setSelectionRange(l,l);}catch(e){}}}}}

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.getAttribute('data-go'));return;}
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='next'){if(el.disabled)return;
    if(D.step===STEPS.length-1){submit();return;}
    D.step++;save();ev('step-'+D.step);render();window.scrollTo(0,0);return;}
  if(a==='back'){D.step=Math.max(0,D.step-1);save();render();window.scrollTo(0,0);return;}
  if(a==='google'){if(el.disabled)return;D.google=!D.google;save();rerender();return;}
  var day=e.target.closest('[data-day]');
  if(day){var d=+day.getAttribute('data-day'),i=D.days.indexOf(d);if(i>=0)D.days.splice(i,1);else D.days.push(d);save();rerender();return;}
});
document.addEventListener('click',function(e){
  var day=e.target.closest('[data-day]');
  if(day&&!e.target.closest('[data-act]')){var d=+day.getAttribute('data-day'),i=D.days.indexOf(d);if(i>=0)D.days.splice(i,1);else D.days.push(d);save();rerender();}
});
document.addEventListener('input',function(e){
  var t=e.target,id=t.id;
  if(id==='m-name'){D.manual.name=t.value;save();refreshNext(D.manual.name.trim()&&D.manual.addr.trim());return;}
  if(id==='m-addr'){D.manual.addr=t.value;save();refreshNext(D.manual.name.trim()&&D.manual.addr.trim());return;}
  if(id==='o-sys'){D.otherSystem=t.value;save();refreshNext(D.otherSystem.trim()&&(D.notify.line.trim()||validEmail(D.notify.email)));return;}
  if(id==='n-line'){D.notify.line=t.value;save();refreshNext((D.system!=='other'||D.otherSystem.trim())&&(D.notify.line.trim()||validEmail(D.notify.email)));return;}
  if(id==='n-email'){D.notify.email=t.value;save();refreshNext((D.system!=='other'||D.otherSystem.trim())&&(D.notify.line.trim()||validEmail(D.notify.email)));return;}
  if(id&&id.indexOf('ct-')===0&&id!=='ct-role'){D.contact[id.slice(3)]=t.value;save();refreshNext(D.contact.name.trim()&&validPhone(D.contact.phone)&&validEmail(D.contact.email));return;}
  if(id==='memo'){D.memo=t.value;save();return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='sys'){D.system=t.value;save();rerender();return;}
  if(t.id==='ct-role'){D.contact.role=t.value;save();return;}
  if(t.id==='g-n'){D.groups=+t.value;save();return;}
  if(t.id==='g-p'){D.maxParty=+t.value;save();return;}
  if(t.dataset&&t.dataset.meal){D[t.dataset.meal].on=t.checked;save();rerender();return;}
  if(t.dataset&&t.dataset.mt){var p=t.dataset.mt.split('-');D[p[0]][p[1]]=t.value;save();return;}
  if(t.id==='agree'){D.agree=t.checked;save();refreshNext(D.agree);return;}
  if(t.id==='ct-phone'||t.id==='ct-email'){rerender();return;}
});
function refreshNext(ok){var b=document.querySelector('[data-act="next"]');if(b)b.disabled=!ok;}

function applicationMemo(){
  const source=new URLSearchParams(location.search).get('source');
  const sources={line:'餐廳小幫手 LINE',bd:'業務轉介',campaign:'招商素材'};
  return [
    Object.hasOwn(sources,source)?'申請來源：'+sources[source]:'',
    D.memo
  ].filter(Boolean).join('\n');
}
async function submit(){
  if(submitting)return;
  const button=document.querySelector('[data-act="next"]');
  const status=document.createElement("p");status.setAttribute("role","status");button.parentNode.before(status);
  submitting=true;button.disabled=true;status.textContent="送出中…";
  try {
  var r=route(), now=new Date();
  var names=['日','一','二','三','四','五','六'];
  var slots=integrated()?'從系統同步':(D.days.slice().sort(function(a,b){return ((a+6)%7)-((b+6)%7);}).map(function(d){return '週'+names[d];}).join('')+'；'+(D.lunch.on?'午 '+D.lunch.s+'–'+D.lunch.e+'；':'')+(D.dinner.on?'晚 '+D.dinner.s+'–'+D.dinner.e+'；':'')+'每 30 分鐘 '+D.groups+' 組、每組最多 '+D.maxParty+' 位');
  var sysLabel={inline:'inline',oddle:'Oddle',other:'其他：'+D.otherSystem,none:'沒有系統'}[D.system];
  var app={id:'OR'+String(now.getFullYear()).slice(2)+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2)+'-'+String(Math.floor(Math.random()*9000)+1000),
    at:now.toLocaleString('zh-TW',{hour12:false}),
    storeName:D.store?D.store.name:D.manual.name,
    storeMeta:D.store?(D.store.district+'　店頁 '+D.store.id+(D.store.chain>=3?'　同名 '+D.store.chain+' 家':'')):'手動：'+D.manual.addr,
    system:D.system, systemLabel:sysLabel+(D.system==='other'||D.system==='none'?'；通知 '+[D.notify.line&&('LINE '+D.notify.line),D.notify.email].filter(Boolean).join('、'):''),
    googleLabel:integrated()?'開通時確認':(D.google?'開啟':'關閉'),
    contact:D.contact, slots:slots, memo:(D.memo||'')+(D.photos.length?'（上傳照片 '+D.photos.length+' 張）':''), route:r};
  const response=await fetch(endpoint+'/functions/v1/merchant-intake',{
    method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(20000),
    body:JSON.stringify({manual:D.manual,booking_system:D.system,other_system:D.otherSystem,
    notify:D.notify,days:D.days,lunch:D.lunch,dinner:D.dinner,groups:D.groups,max_party:D.maxParty,
    google:D.google,contact:D.contact,agree:D.agree,memo:applicationMemo()})
  });
  const result=await response.json();
  if(!response.ok||!result.app_no)throw new Error(result.error||'系統暫時無法送出');
  if(result.duplicate)throw new Error('這間餐廳已申請，原編號 '+result.app_no+'。請聯絡餐廳小幫手。');
  app.id=result.app_no;
  app.route=result.route;
  ev('submit');
  lastDone=app;D=fresh();save();
  R='done';try{history.replaceState(null,'','#done');}catch(e){}render();window.scrollTo(0,0);
  }catch(error){status.textContent=error.message||'暫時無法送出，請稍後再試';}
  finally{submitting=false;button.disabled=false;}
}
var submitting=false;

window.addEventListener('hashchange',function(){var r=routeFrom();if(r!==R){R=r;render();window.scrollTo(0,0);}});
ev('visit');
R=routeFrom();if(R==='apply'){ev('start');}
render();
})();
</script>
</body>
</html>
